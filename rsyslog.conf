# rsyslog config for receiving MikroTik syslog
# Only PPP account login/logout events are kept; everything else is discarded.

module(load="imudp")
input(type="imudp" port="514")

module(load="imtcp")
input(type="imtcp" port="514")

$ModLoad imuxsock
$SystemLogSocketName /dev/null

$umask 0022
$FileCreateMode 0644
$DirCreateMode 0755

$template DailyPerHost,"/var/log/remote/%HOSTNAME%/%$YEAR%-%$MONTH%-%$DAY%.log"

if ($rawmsg contains "pppoe,ppp,info,account") then {
    action(type="omfile" DynaFile="DailyPerHost")
}
stop
